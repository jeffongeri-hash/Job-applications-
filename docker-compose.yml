# ─────────────────────────────────────────────────────────────────────────────
# Quick start — no build required for the backend:
#   copy .env.example .env.local
#   docker compose up -d
#   open http://localhost:3000
#
# The job-ops backend uses the published image (no source build).
# The frontend builds locally (~30 s with Docker layer cache).
#
# Optional services (only started when explicitly requested):
#   Naukri:   docker compose --profile naukri up -d naukri-applier
#   LinkedIn: see Search page → "LinkedIn config" button (runs locally)
# ─────────────────────────────────────────────────────────────────────────────

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "5m"
    max-file: "2"

services:

  # ── job-ops backend — pre-built image, no source compile ─────────────────────
  job-ops:
    image: ghcr.io/dakheera47/job-ops:latest   # pull only, zero build time
    container_name: job-ops
    restart: on-failure:3
    ports:
      - "3005:3001"
    volumes:
      - job-ops-data:/app/data
    environment:
      NODE_ENV: production
      PORT: 3001
      PYTHON_PATH: /usr/bin/python3
      DATA_DIR: /app/data
      # LLM_PROVIDER: openai
      # LLM_API_KEY: sk-...
      # LLM_MODEL: gpt-4o-mini
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 512M
    logging: *default-logging

  # ── Next.js frontend ─────────────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: job-ops-ui:local
    container_name: job-ops-ui
    restart: on-failure:3
    ports:
      - "3000:3000"
    depends_on:
      - job-ops
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_JOB_OPS_URL: http://job-ops:3001
      JOB_OPS_URL: http://job-ops:3001
      NAUKRI_SERVICE_URL: http://naukri-applier:4000
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    logging: *default-logging

  # ── Naukri applier (optional) ─────────────────────────────────────────────────
  # Headless Chrome + Flask — only starts with: docker compose --profile naukri up -d
  naukri-applier:
    profiles: ["naukri"]
    build:
      context: ./naukri-service
      dockerfile: Dockerfile
    image: naukri-applier:local
    container_name: naukri-applier
    restart: on-failure:3
    ports:
      - "4000:4000"
    volumes:
      - naukri-data:/app/userdata
      - naukri-logs:/app/logs
    environment:
      NAUKRI_EMAIL:        "${NAUKRI_EMAIL:-}"
      NAUKRI_PASSWORD:     "${NAUKRI_PASSWORD:-}"
      NAUKRI_FILTERED_URL: "${NAUKRI_FILTERED_URL:-}"
      NAUKRI_APPLY_LIMIT:  "${NAUKRI_APPLY_LIMIT:-10}"
      DATA_DIR: /app/userdata
      LOG_DIR:  /app/logs
    shm_size: "1gb"
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1G
    logging: *default-logging

volumes:
  job-ops-data:
  naukri-data:
  naukri-logs:
