# ─────────────────────────────────────────────────────────────────────────────
# Full stack: job-ops backend + JobOps UI + Naukri applier + LinkedIn applier
#
# Quick start (core only):
#   git clone https://github.com/DaKheera47/job-ops ../job-ops
#   copy .env.example .env.local
#   docker compose up -d
#   open http://localhost:3000
#
# Naukri applier (optional):
#   docker compose --profile naukri up -d naukri-applier
#   Set NAUKRI_EMAIL / NAUKRI_PASSWORD / NAUKRI_FILTERED_URL env vars
#   Or trigger via: POST http://localhost:4000/run
#
# LinkedIn applier (optional, local only):
#   git clone https://github.com/GodsScion/Auto_job_applier_linkedIn ../linkedin-applier
#   Use "LinkedIn config" button in the Search page, then:
#   docker compose --profile linkedin up -d linkedin-applier
# ─────────────────────────────────────────────────────────────────────────────

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:

  # ── job-ops backend ──────────────────────────────────────────────────────────
  job-ops:
    build:
      context: ../job-ops
      dockerfile: Dockerfile
      args:
        BUILDKIT_INLINE_CACHE: "1"
    image: job-ops:local
    container_name: job-ops
    restart: on-failure:3
    ports:
      - "3005:3005"
    volumes:
      - job-ops-data:/app/data
    environment:
      NODE_ENV: production
      PORT: 3005
      # LLM_PROVIDER: openai
      # LLM_API_KEY: sk-...
      # LLM_MODEL: gpt-4o-mini
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 512M
        reservations:
          cpus: "0.10"
          memory: 128M
    logging: *default-logging

  # ── Next.js frontend ─────────────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILDKIT_INLINE_CACHE: "1"
    image: job-ops-ui:local
    container_name: job-ops-ui
    restart: on-failure:3
    ports:
      - "3000:3000"
    depends_on:
      - job-ops
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_JOB_OPS_URL: http://job-ops:3005
      JOB_OPS_URL: http://job-ops:3005
      # Naukri service URL (used by /api/naukri-run route)
      NAUKRI_SERVICE_URL: http://naukri-applier:4000
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          cpus: "0.05"
          memory: 64M
    logging: *default-logging

  # ── Naukri auto-applier ───────────────────────────────────────────────────────
  # Built from naukri-service/ — headless Chrome + Flask REST API.
  # Trigger a run from the "Naukri" tab in the Search page or via curl:
  #   curl -X POST http://localhost:4000/run \
  #     -H "Content-Type: application/json" \
  #     -d '{"email":"you@email.com","password":"...","filteredUrl":"https://www.naukri.com/jobs-in-india?..."}'
  naukri-applier:
    profiles: ["naukri"]
    build:
      context: ./naukri-service
      dockerfile: Dockerfile
      args:
        BUILDKIT_INLINE_CACHE: "1"
    image: naukri-applier:local
    container_name: naukri-applier
    restart: on-failure:3
    ports:
      - "4000:4000"
    volumes:
      - naukri-data:/app/userdata
      - naukri-logs:/app/logs
    environment:
      NAUKRI_EMAIL:        "${NAUKRI_EMAIL:-}"
      NAUKRI_PASSWORD:     "${NAUKRI_PASSWORD:-}"
      NAUKRI_FILTERED_URL: "${NAUKRI_FILTERED_URL:-}"
      NAUKRI_APPLY_LIMIT:  "${NAUKRI_APPLY_LIMIT:-10}"
      DATA_DIR: /app/userdata
      LOG_DIR:  /app/logs
    shm_size: "1gb"
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 512M
    logging: *default-logging

  # ── LinkedIn auto-applier (local/Windows only) ────────────────────────────────
  linkedin-applier:
    profiles: ["linkedin"]
    build:
      context: ../linkedin-applier
      dockerfile: Dockerfile.docker
    image: linkedin-applier:local
    container_name: linkedin-applier
    restart: "no"
    volumes:
      - ./linkedin-config:/app/config:ro
      - linkedin-output:/app/all excels
      - linkedin-logs:/app/logs
    environment:
      DISPLAY: ":99"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    shm_size: "1gb"
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1G
    logging: *default-logging

volumes:
  job-ops-data:
  naukri-data:
  naukri-logs:
  linkedin-output:
  linkedin-logs:
