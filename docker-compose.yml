# ─────────────────────────────────────────────────────────────────────────────
# Lightweight stack: job-ops backend + JobOps UI frontend
#
# Quick start:
#   1. Clone job-ops next to this folder:
#        git clone https://github.com/DaKheera47/job-ops ../job-ops
#   2. Copy env:    copy .env.example .env.local
#   3. Launch:      docker compose up -d
#   4. Open:        http://localhost:3000
#
# BuildKit is required for cache-mount speed (enabled via DOCKER_BUILDKIT=1
# in .env or via "DOCKER_BUILDKIT=1 docker compose build").
#
# LinkedIn auto-apply (optional):
#   docker compose --profile linkedin up -d linkedin-applier
#   Then use the "Export LinkedIn config" button in the Search page.
# ─────────────────────────────────────────────────────────────────────────────

x-logging: &default-logging          # unified compact log format
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:

  # ── job-ops backend ──────────────────────────────────────────────────────────
  job-ops:
    build:
      context: ../job-ops
      dockerfile: Dockerfile
      args:
        BUILDKIT_INLINE_CACHE: "1"  # embed layer cache for faster rebuilds
    image: job-ops:local            # tag locally so Docker doesn't re-pull
    container_name: job-ops
    restart: on-failure:3
    ports:
      - "3005:3005"
    volumes:
      - job-ops-data:/app/data
    environment:
      NODE_ENV: production
      PORT: 3005
      # ── paste your LLM key below ──────────────────────────────────────────
      # LLM_PROVIDER: openai
      # LLM_API_KEY: sk-...
      # LLM_MODEL: gpt-4o-mini
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 512M
        reservations:
          cpus: "0.10"
          memory: 128M
    logging: *default-logging

  # ── Next.js frontend ─────────────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILDKIT_INLINE_CACHE: "1"
    image: job-ops-ui:local
    container_name: job-ops-ui
    restart: on-failure:3
    ports:
      - "3000:3000"
    depends_on:
      - job-ops
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_JOB_OPS_URL: http://job-ops:3005
      JOB_OPS_URL: http://job-ops:3005
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          cpus: "0.05"
          memory: 64M
    logging: *default-logging

  # ── LinkedIn auto-applier (optional, start with --profile linkedin) ──────────
  # Runs GodsScion/Auto_job_applier_linkedIn in a headless Chrome container.
  # Config files are generated by the UI and mounted into the container.
  #
  # Setup:
  #   git clone https://github.com/GodsScion/Auto_job_applier_linkedIn ../linkedin-applier
  #   # Use "Export LinkedIn config" button in the app, then:
  #   docker compose --profile linkedin up -d linkedin-applier
  linkedin-applier:
    profiles: ["linkedin"]          # only starts when explicitly requested
    build:
      context: ../linkedin-applier
      dockerfile: Dockerfile.docker  # the bot's own Dockerfile (if present)
    image: linkedin-applier:local
    container_name: linkedin-applier
    restart: "no"                   # run once, don't loop automatically
    volumes:
      # Config files generated by gen-linkedin-config.mjs or the UI button
      - ./linkedin-config:/app/config:ro
      # Resume PDF — copy yours into ./linkedin-config/resume.pdf
      - ./linkedin-config/resume.pdf:/app/all resumes/default/resume.pdf:ro
      # Output — application history CSV and logs persist on host
      - linkedin-output:/app/all excels
      - linkedin-logs:/app/logs
    environment:
      DISPLAY: ":99"               # virtual display for headless Chrome
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    shm_size: "1gb"                # Chrome needs shared memory
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 512M
    logging: *default-logging

volumes:
  job-ops-data:
  linkedin-output:
  linkedin-logs:
