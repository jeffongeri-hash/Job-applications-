# Railway config for the Naukri auto-applier service.
# In Railway dashboard: set Root Directory = /naukri-service

[build]
builder        = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath    = "/health"
healthcheckTimeout = 60
restartPolicyType  = "on_failure"
restartPolicyMaxRetries = 3

[[services]]
name = "naukri-applier"
